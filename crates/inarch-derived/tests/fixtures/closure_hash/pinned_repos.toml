# Pinned real repositories for the closure_hash cross-host, mutation-sensitivity and outside-edit
# probes.
#
# Every entry names one public repository by URL, default branch and the 40-hex commit that
# branch pointed at when it was resolved with `git ls-remote <url> refs/heads/<branch>` on
# 2026-10-23 (UTC). The manifest and lockfile named in each entry were confirmed to exist at that
# exact commit through the GitHub contents API (`ref=<sha>`).
#
# Contract (read by the #[ignore] probes in closure_hash_test.rs; the in-process suite only
# lints the shape):
#   * exactly two entries per ecosystem, ecosystems go | cargo | typescript | python
#   * `sha` is the pin; a checkout whose `git rev-parse HEAD` differs from it is a test failure
#   * `manifest` and `lockfile` are repository-relative; a checkout missing either is a test failure
#   * `pin_file` / `pin_content`, when present, are written into the checkout ONLY when the file is
#     absent there: they model the toolchain or interpreter declaration a hermetic runner supplies
#     as tree content. A closure hash never reads the host toolchain (design: closure_hash is a
#     pure function of the tree), so a repository without a pin file is refused by the library
#     unless the runner declares one. Go repositories carry their pin in go.mod (`go` directive).

schema = "closure-hash-pinned-repos/1"
resolved_on = "2026-10-23"

