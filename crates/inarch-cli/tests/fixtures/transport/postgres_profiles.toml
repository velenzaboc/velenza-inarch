[[case]]
name = "unix-socket-is-node-internal"
url = "postgresql:///ledger?host=/var/run/postgresql"
driver_reports_negotiated_group = false
expect = "node_internal"

[[case]]
name = "ipv4-loopback-is-node-internal"
