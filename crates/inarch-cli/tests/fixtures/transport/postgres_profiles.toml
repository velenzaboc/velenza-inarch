name = "postgres-scheme-sslmode-require"
url = "postgres://ledger@db.example.com:5432/ledger?sslmode=require&ssl_min_protocol_version=TLSv1.3"
server_ssl_groups = "X25519MLKEM768"
driver_reports_negotiated_group = true
