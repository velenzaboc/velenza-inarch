[[case]]
name = "host-parameter-names-a-network-host"
url = "postgresql:///ledger?host=db.example.com&sslmode=disable&ssl_min_protocol_version=TLSv1.3"
server_ssl_groups = "X25519MLKEM768"
driver_reports_negotiated_group = true
expect = "refuse"
