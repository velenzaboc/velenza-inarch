[[case]]
name = "server-groups-postgres-18-default"
url = "postgresql://ledger@db.example.com:5432/ledger?sslmode=verify-full&ssl_min_protocol_version=TLSv1.3"
server_ssl_groups = "X25519:prime256v1" # [pqc-reference-only] classical-only server default that must be refused
driver_reports_negotiated_group = true
expect = "refuse"
reason = "server_ssl_groups"

[[case]]
name = "server-groups-hybrid-plus-classical"
url = "postgresql://ledger@db.example.com:5432/ledger?sslmode=verify-full&ssl_min_protocol_version=TLSv1.3"
server_ssl_groups = "X25519MLKEM768:X25519" # [pqc-reference-only] a classical group beside the hybrid must be refused
driver_reports_negotiated_group = true
expect = "refuse"
reason = "server_ssl_groups"

[[case]]
name = "server-groups-undeclared"
url = "postgresql://ledger@db.example.com:5432/ledger?sslmode=verify-full&ssl_min_protocol_version=TLSv1.3"
driver_reports_negotiated_group = true
expect = "refuse"
reason = "server_ssl_groups"

