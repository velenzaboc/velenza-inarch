# Postgres carrier cases for the post-quantum-only transport profile.
#
# A networked Postgres connection is admitted only with sslmode=verify-full,
# ssl_min_protocol_version=TLSv1.3, a server ssl_groups setting that names post-quantum-bearing
# groups only, and a driver that reports the negotiated group. A Unix socket or a literal
# loopback address is node-internal and is not a carrier.
#
# Each refused case violates exactly one rule, so the expected reason is unambiguous.
# expect: refuse | networked_verify_full | node_internal
# reason (refuse only): sslmode | server_ssl_groups | min_protocol | group_not_reportable
# Values are plain double-quoted strings without escapes, or true/false.

[[case]]
name = "networked-verify-full-post-quantum"
url = "postgresql://ledger@db.example.com:5432/ledger?sslmode=verify-full&ssl_min_protocol_version=TLSv1.3"
server_ssl_groups = "X25519MLKEM768"
driver_reports_negotiated_group = true
expect = "networked_verify_full"

[[case]]
name = "sslmode-disable"
url = "postgresql://ledger@db.example.com:5432/ledger?sslmode=disable&ssl_min_protocol_version=TLSv1.3"
server_ssl_groups = "X25519MLKEM768"
driver_reports_negotiated_group = true
expect = "refuse"
reason = "sslmode"

[[case]]
name = "sslmode-prefer"
url = "postgresql://ledger@db.example.com:5432/ledger?sslmode=prefer&ssl_min_protocol_version=TLSv1.3"
server_ssl_groups = "X25519MLKEM768"
driver_reports_negotiated_group = true
