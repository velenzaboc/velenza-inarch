[[case]]
name = "driver-cannot-report-negotiated-group"
url = "postgresql://ledger@db.example.com:5432/ledger?sslmode=verify-full&ssl_min_protocol_version=TLSv1.3"
server_ssl_groups = "X25519MLKEM768"
