# Pinned replay corpus for the swarm benchmark.
#
# Every entry is a real public repository fixed to one commit. Nothing here is
# generated. commit_count is the number of commits reachable from commit_sha,
# read on 2026-10-23 from the host's commit listing (page count at one commit
# per page). The pins were resolved on the same day with `git ls-remote <url> HEAD`.
#
# Two further source datasets are named by the benchmark plan as leads and are
# deliberately not listed yet, because no repository from them has been resolved
# to a commit: the AIDev dataset (arXiv 2607.04697) and the AgenticFlict dataset
# (Zenodo 10.5281/zenodo.19396917). A repository is added only together with the
# commit it was resolved to.

